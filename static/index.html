<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>N5 Voice Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e6e4de;
    --conv: #2f6fde; --help: #7a4fd6; --ai: #0f9d75; --think: #c2410c;
    --ok: #0f9d75; --ok-bg: #e5f6ef; --warn: #c2410c; --warn-bg: #fdeee5; --tent-bg: #fff6d6;
    --user-bubble: #eef3fd; --bot-bubble: #f3f2ee; --help-bubble: #f3eefc; --kara: #d6e4fc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d20; --ink: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --ok-bg: #12332a; --warn-bg: #3a2216; --tent-bg: #3a3214;
      --user-bubble: #1f2a40; --bot-bubble: #26262b; --help-bubble: #2b2340; --kara: #2a3d63;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, "Noto Sans JP", system-ui, sans-serif; }
  .ja { font-family: "Noto Sans JP", Inter, sans-serif; }

  /* header */
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  header h1 span { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; background: var(--bg); border: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pulse .dot { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; transform: scale(.75); } }
  .st-listening .dot, .st-speaking .dot { background: var(--conv); }
  .st-thinking { color: var(--think); } .st-thinking .dot { background: var(--think); }
  .st-ai { color: var(--ai); } .st-ai .dot { background: var(--ai); }

  /* buttons */
  button { font: inherit; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--conv); border-color: var(--conv); color: #fff; }
  button.danger { background: #c7362d; border-color: #c7362d; color: #fff; }
  button.muted { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }

  /* layout */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px 20px; max-width: 1240px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .card-head h2, summary.h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; font-weight: 600; }
  .side { display: flex; flex-direction: column; gap: 16px; }

  /* mode toggle */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; background: transparent; color: var(--muted); }
  .seg button.on { color: #fff; }
  .seg button.on.conv { background: var(--conv); }
  .seg button.on.help { background: var(--help); }
  .seg button:disabled { opacity: 1; }

  /* transcript */
  #transcript { height: calc(100vh - 200px); min-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; max-width: 360px; }
  .empty b { color: var(--ink); }
  .msg { max-width: 82%; padding: 8px 13px; border-radius: 14px; }
  .msg .who { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 1px; display: flex; gap: 6px; align-items: center; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .msg.bot.help { background: var(--help-bubble); }
  /* karaoke: unsaid text dim; current chunk fills in char by char (per-char animation-delay) */
  .msg.bot .unsaid { color: var(--muted); }
  .msg.bot .k { animation: kfill .12s linear both; border-radius: 2px; }
  @keyframes kfill { from { color: var(--muted); } to { color: var(--ink); background: var(--kara); } }
  .msg.bot .kfade { animation: kfade .5s ease-out both; border-radius: 2px; }
  @keyframes kfade { from { background: var(--kara); } to { background: transparent; } }
  .msg.interim { opacity: .65; }
  .msg .alt { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: Inter, sans-serif; }
  .msg .alt:empty { display: none; }
  .msg .alt { opacity: .7; }
  .lang { display: inline-block; font: 700 10px/1.6 Inter, sans-serif; padding: 0 6px; border-radius: 5px; margin-right: 6px; vertical-align: 2px; border: 1px solid var(--line); color: var(--muted); }
  .lang.on.ja { background: var(--conv); border-color: var(--conv); color: #fff; }
  .lang.on.en { background: var(--help); border-color: var(--help); color: #fff; }
  .tag { font-size: 10px; padding: 0 6px; border-radius: 6px; background: var(--bg); font-weight: 600; }
  .tag.help { color: var(--help); }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }
  mark.v { background: var(--ok-bg); color: var(--ok); padding: 0 2px; border-radius: 3px; font-weight: 600; }

  /* word bank */
  .progress { font-size: 13px; font-weight: 700; }
  .bar { height: 5px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
  .bar > div { height: 100%; background: var(--ok); width: 0; transition: width .4s ease; }
  .words { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .word { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; position: relative; transition: background .3s, border-color .3s; }
  .word .jp { font-size: 19px; font-weight: 700; line-height: 1.3; }
  .word .rd, .word .en { font-size: 12px; color: var(--muted); }
  .hide-en .word .en { display: none; }
  .word .badge { position: absolute; top: 6px; right: 9px; font-size: 13px; font-weight: 700; }
  .word.tentative { background: var(--tent-bg); border-color: #e2c55c; }
  .word.correct { background: var(--ok-bg); border-color: var(--ok); }
  .word.correct .jp, .word.correct .badge { color: var(--ok); }
  .word.wrong { border-color: var(--warn); }
  .word.wrong .badge, .word .note { color: var(--warn); }
  .word .note { font-size: 11px; }
  .word.just { animation: pop .6s ease; }
  @keyframes pop { 40% { transform: scale(1.05); } }
  .toggle { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

  /* collapsibles */
  details.card > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "▸"; color: var(--muted); font-size: 12px; }
  details.card[open] > summary::after { content: "▾"; }
  details.card[open] > summary { margin-bottom: 12px; }
  label { font-size: 13px; color: var(--muted); }
  input[type=range] { width: 100%; }
  .kv { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ctx { font-size: 12px; color: var(--muted); margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .ctx div { margin-bottom: 4px; }
  .ctx b { color: var(--ink); font-weight: 600; }
  #debug { max-height: 340px; overflow-y: auto; font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; flex-direction: column; gap: 6px; }
  .dbg { border-left: 3px solid var(--line); padding: 2px 8px; }
  .dbg.route { border-color: var(--conv); } .dbg.decision { border-color: var(--ok); } .dbg.err { border-color: var(--warn); }

  /* summary dialog */
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--ink); max-width: 500px; width: calc(100% - 32px); padding: 20px 22px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 6px; }
  .sum-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
  .chip { padding: 3px 10px; border-radius: 999px; font-size: 14px; border: 1px solid var(--line); }
  .chip.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <h1>N5 Voice Tutor<span class="ja">日本語</span></h1>
  <div id="statusPill" class="pill"><span class="dot"></span><span id="statusText">Idle</span></div>
  <div class="spacer"></div>
  <button id="muteBtn" disabled>🎙️ Mute</button>
  <button id="startBtn" class="primary">Start</button>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <h2>Conversation</h2>
      <div class="seg" title="Mode switches automatically; click to force">
        <button id="convBtn" class="conv on" disabled>Japanese mode</button>
        <button id="helpBtn" class="help" disabled>English help</button>
      </div>
    </div>
    <div id="transcript">
      <div class="empty">Press <b>Start</b> and answer the tutor in Japanese.<br />Ask anything in English to get help; say <b>"I'm back"</b> to return.</div>
    </div>
  </section>

  <aside class="side">
    <section class="card" id="vocabCard">
      <div class="card-head">
        <h2>Word bank</h2>
        <span class="progress" id="progress">0 / 0</span>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <div class="words" id="words"><div class="kv">Words appear when the session starts.</div></div>
      <div style="margin-top:10px"><label class="toggle"><input type="checkbox" id="showEn" checked /> Show meanings</label></div>
    </section>

    <details class="card" open>
      <summary class="h2">Settings</summary>
      <label for="patience">Response patience: <b id="patienceLabel"></b></label>
      <input id="patience" type="range" min="1" max="5" step="1" value="3" />
      <div class="kv" id="patienceKv"></div>
      <div class="ctx" id="ctx"></div>
    </details>

    <details class="card" id="debugCard" open>
      <summary class="h2">Debug · Decisions API</summary>
      <div id="debug"></div>
    </details>
  </aside>
</main>

<dialog id="summary">
  <h3>Session summary</h3>
  <div id="summaryBody"></div>
  <div class="row"><button id="closeSummary">Close</button></div>
</dialog>

<audio id="botAudio" autoplay></audio>

<script type="module">
import { PipecatClient } from "https://esm.sh/@pipecat-ai/client-js@1.16.0";
import { SmallWebRTCTransport } from "https://esm.sh/@pipecat-ai/small-webrtc-transport@1.11.2";

const $ = (id) => document.getElementById(id);
const PATIENCE = {
  1: { name: "Snappy", eot_threshold: 0.7, eot_timeout_ms: 3000 },
  2: { name: "Relaxed", eot_threshold: 0.75, eot_timeout_ms: 4500 },
  3: { name: "Patient", eot_threshold: 0.8, eot_timeout_ms: 6000 },
  4: { name: "Very patient", eot_threshold: 0.85, eot_timeout_ms: 9000 },
  5: { name: "Take your time", eot_threshold: 0.9, eot_timeout_ms: 14000 },
};
const MODE_LABEL = { conversation: "Japanese practice", help: "English help" };

let client = null;
let words = [];
const wordState = {}; // id -> {status: idle|tentative|correct|wrong, note}
let mode = "conversation";
let muted = false;
let userInTurn = false, botSpeaking = false, botThinking = false;
let lastInterim = "", lastInterimChange = 0;
let interimEl = null, botEl = null, lastUserEl = null;
let enLive = "";
const userMsgs = [];

// ---------- transcript ----------
function addMsg(kind, who, html) {
  const el = document.createElement("div");
  el.className = `msg ${kind}`;
  el.innerHTML = `<div class="who">${who}</div><div class="txt ja"></div>${kind.startsWith("user") ? '<div class="alt"></div>' : ""}`;
  el.querySelector(".txt").innerHTML = html;
  $("transcript").appendChild(el);
  pinInterim();
  scroll();
  return el;
}
// Live (interim) bubble always stays last, so it never sits above a newer tutor bubble
function pinInterim() { if (interimEl) $("transcript").appendChild(interimEl); }
function sys(text) {
  const el = document.createElement("div");
  el.className = "sys"; el.textContent = text;
  $("transcript").appendChild(el); pinInterim(); scroll();
}
function scroll() { const t = $("transcript"); t.scrollTop = t.scrollHeight; }
function esc(s) { return (s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }
function highlight(text) {
  let html = esc(text);
  for (const w of words) {
    if (wordState[w.id]?.status !== "correct") continue;
    for (const s of w.stems) html = html.split(s).join(`<mark class="v">${s}</mark>`);
  }
  return html;
}

// ---------- karaoke ----------
// Flux TTS has no word timings: server marks when each ja/en chunk starts/ends playing,
// and the chunk fills in over its audio duration (or an estimate from these rates).
const CHARS_PER_SEC = { ja: 7, en: 14 };
function findRun(text, chunk, from) {
  let i = text.indexOf(chunk, from);
  if (i < 0) i = text.indexOf(chunk.slice(0, 4), from);
  if (i < 0) i = from;
  return [i, Math.min(text.length, i + chunk.length)];
}
function renderBot(el) {
  const t = el._text || "";
  const k = el._k;
  const txt = el.querySelector(".txt");
  if (!k) { txt.textContent = t; return; }
  const cur = k.cur;
  const doneTo = cur ? cur.s : k.said;
  const now = performance.now();
  // Negative delays resume animations where they were, so re-renders don't restart them
  const f = k.fade;
  let html;
  if (f && f.e <= doneTo) {
    html = esc(t.slice(0, f.s))
      + `<span class="kfade" style="animation-delay:${Math.round(f.t0 - now)}ms">${esc(t.slice(f.s, f.e))}</span>`
      + esc(t.slice(f.e, doneTo));
  } else {
    html = esc(t.slice(0, doneTo));
  }
  if (cur) {
    const chars = [...t.slice(cur.s, cur.e)];
    const step = cur.dur / Math.max(1, chars.length);
    html += chars.map((c, i) => `<span class="k" style="animation-delay:${Math.round(cur.t0 + i * step - now)}ms">${esc(c)}</span>`).join("");
  }
  html += `<span class="unsaid">${esc(t.slice(cur ? cur.e : k.said))}</span>`;
  txt.innerHTML = html;
}

// ---------- vocab ----------
function renderWords() {
  const box = $("words");
  box.innerHTML = "";
  for (const w of words) {
    const st = wordState[w.id] || { status: "idle" };
    const el = document.createElement("div");
    el.className = `word ${st.status} ${st.just ? "just" : ""}`;
    const badge = { correct: "✓", wrong: "!", tentative: "…" }[st.status] || "";
    el.innerHTML = `<span class="badge">${badge}</span>
      <div class="jp ja">${w.ja}</div><div class="rd ja">${w.reading}</div><div class="en">${w.en}</div>
      ${st.note ? `<div class="note">${st.note}</div>` : ""}`;
    box.appendChild(el);
    st.just = false;
  }
  const done = words.filter((w) => wordState[w.id]?.status === "correct").length;
  $("progress").textContent = `${done} / ${words.length}`;
  $("bar").style.width = words.length ? `${(100 * done) / words.length}%` : "0";
}
function setWord(id, status, note = "") {
  const prev = wordState[id]?.status;
  if (prev === "correct") return;
  wordState[id] = { status, note, just: status !== prev };
  renderWords();
}
function rehighlightUser() { for (const u of userMsgs) u.el.querySelector(".txt").innerHTML = (u.prefix || "") + highlight(u.text); }
function langBadge(lang, on) { return `<span class="lang ${lang} ${on ? "on" : ""}" title="${on ? "used" : "not used"}">${lang.toUpperCase()}${on ? " ✓" : ""}</span>`; }
function jaOf(id) { return words.find((w) => w.id === id)?.ja || id; }

// ---------- status ----------
function setMode(m) {
  mode = m;
  $("convBtn").classList.toggle("on", m === "conversation");
  $("helpBtn").classList.toggle("on", m === "help");
  $("convBtn").disabled = !client || m === "conversation";
  $("helpBtn").disabled = !client || m === "help";
}
function updateStatus() {
  let cls = "", text = "Idle", pulse = false;
  if (client) {
    if (muted && !botSpeaking) { cls = "st-thinking"; text = "Mic muted"; }
    else if (botSpeaking) { cls = "st-ai"; text = "Tutor speaking"; pulse = true; }
    else if (botThinking) { cls = "st-ai"; text = "Tutor thinking…"; pulse = true; }
    else if (userInTurn && Date.now() - lastInterimChange > 900) { cls = "st-thinking"; text = "Still thinking…"; pulse = true; }
    else if (userInTurn) { cls = "st-speaking"; text = "Hearing you"; pulse = true; }
    else { cls = "st-listening"; text = "Listening"; }
  }
  $("statusPill").className = `pill ${cls} ${pulse ? "pulse" : ""}`;
  $("statusText").textContent = text;
}
setInterval(updateStatus, 250);

function renderCtx(s) {
  $("ctx").innerHTML = `<div>Last tutor question: <b class="ja">${s.last_tutor_line ? esc(s.last_tutor_line) : "—"}</b></div>
    <div>Partial answer: <b class="ja">${s.partial_answer ? esc(s.partial_answer) : "—"}</b></div>`;
}

// ---------- debug ----------
function dbg(cls, html) {
  const el = document.createElement("div");
  el.className = `dbg ${cls}`; el.innerHTML = html;
  $("debug").prepend(el);
}

// ---------- controls ----------
function patienceVal() { return PATIENCE[$("patience").value]; }
function renderPatience() {
  const p = patienceVal();
  $("patienceLabel").textContent = p.name;
  $("patienceKv").textContent = `Flux eot_threshold ${p.eot_threshold} · eot_timeout_ms ${p.eot_timeout_ms}`;
}
$("patience").addEventListener("input", renderPatience);
$("patience").addEventListener("change", () => {
  const p = patienceVal();
  client?.sendClientMessage("patience", { eot_threshold: p.eot_threshold, eot_timeout_ms: p.eot_timeout_ms });
});
renderPatience();

$("showEn").addEventListener("change", (e) => $("vocabCard").classList.toggle("hide-en", !e.target.checked));
$("helpBtn").onclick = () => client?.sendClientMessage("mode", { action: "help" });
$("convBtn").onclick = () => client?.sendClientMessage("mode", { action: "resume" });
$("closeSummary").onclick = () => $("summary").close();

// Mute just stops sending mic audio: no transcript, no turn, conversation untouched
function setMuted(m) {
  muted = m;
  client?.enableMic(!m);
  $("muteBtn").textContent = m ? "🔇 Unmute" : "🎙️ Mute";
  $("muteBtn").classList.toggle("muted", m);
  updateStatus();
}
$("muteBtn").onclick = () => setMuted(!muted);

// ---------- server messages ----------
function onServerMessage(m) {
  switch (m.type) {
    case "session":
      words = m.words;
      renderWords();
      dbg("route", `session · LLM <b>${m.llm}</b> · voices ${m.voices.ja} / ${m.voices.help}`);
      break;
    case "state":
      renderCtx(m);
      if (m.mode !== mode) setMode(m.mode);
      break;
    case "mode":
      setMode(m.mode);
      sys(`→ ${MODE_LABEL[m.mode]}`);
      break;
    case "route": {
      if (m.error) { dbg("err", `mode decision failed (kept ${m.mode}): ${esc(m.error)}`); break; }
      dbg("route", `spoke <b>${m.spoke}</b> (ja ${m.language_probabilities.japanese ?? "-"} · en ${m.language_probabilities.english ?? "-"}) → <b>${m.choice}</b> (${m.probabilities.conversation} / ${m.probabilities.help}) · ${m.latency_ms} ms<br>ja: ${esc(m.text)}<br>en: ${esc(m.en_text)}`);
      enLive = "";
      if (!lastUserEl) break;
      // Chosen (intelligible) transcript up top with a filled badge; the other one dimmed below
      const usedLang = m.spoke === "english" ? "en" : "ja";
      const otherLang = usedLang === "en" ? "ja" : "en";
      const used = m.llm_text || m.text;
      const other = usedLang === "en" ? m.text : m.en_text;
      const prefix = langBadge(usedLang, true);
      const u = userMsgs[userMsgs.length - 1];
      if (u) { u.text = used; u.prefix = prefix; }
      lastUserEl.querySelector(".txt").innerHTML = prefix + highlight(used);
      const alt = lastUserEl.querySelector(".alt");
      if (alt) alt.innerHTML = other ? langBadge(otherLang, false) + `<s>${esc(other)}</s>` : "";
      if (m.mode === "help") lastUserEl.querySelector(".who").innerHTML = `You <span class="tag help">help</span>`;
      break;
    }
    case "en_live":
      enLive = m.text;
      if (userInTurn && m.text) {
        if (!interimEl) interimEl = addMsg("user interim", "You", "");
        const alt = interimEl.querySelector(".alt");
        if (alt) alt.innerHTML = m.text ? langBadge("en", false) + esc(m.text) : "";
        scroll();
      }
      break;
    case "vocab_tentative":
      setWord(m.word_id, "tentative");
      break;
    case "vocab_decision": {
      for (const r of m.results) {
        if (r.verdict === "correct") setWord(r.word_id, "correct");
        else if (r.verdict === "wrong_form") setWord(r.word_id, "wrong", "negated or wrong meaning");
        else if (wordState[r.word_id]?.status === "tentative")
          setWord(r.word_id, r.verdict === "mentioned_only" ? "wrong" : "idle", r.verdict === "mentioned_only" ? "mentioned, not used" : "");
      }
      rehighlightUser();
      const hits = m.results.filter((r) => r.verdict !== "absent");
      const lines = hits.map((r) => `${jaOf(r.word_id)} → <b>${r.verdict}</b> (${r.confidence})`).join("<br>") || "no target words";
      dbg("decision", `vocab · ${esc(m.text)}<br>${lines}`);
      break;
    }
    case "decision_error":
      dbg("err", `Decisions error: ${esc(m.error)}`);
      break;
    case "patience":
      dbg("route", `patience → eot ${m.eot_threshold}, timeout ${m.eot_timeout_ms} ms`);
      break;
    case "tts_run": {
      const el = botEl;
      if (!el) break;
      el._k ||= { said: 0, cur: null };
      if (m.state === "start") {
        const [s, e] = findRun(el._text || "", m.text, el._k.said);
        const dur = m.duration_ms ?? Math.round((1000 * (e - s)) / (CHARS_PER_SEC[m.lang] || 8));
        el._k.cur = { s, e, dur, t0: performance.now() };
      } else {
        if (el._k.cur) {
          el._k.said = el._k.cur.e;
          el._k.fade = { s: el._k.cur.s, e: el._k.cur.e, t0: performance.now() };
        }
        el._k.cur = null;
      }
      renderBot(el);
      break;
    }
    case "summary":
      showSummary(m);
      break;
  }
}

function showSummary(m) {
  const done = words.filter((w) => m.practiced[w.id]);
  const todo = words.filter((w) => !m.practiced[w.id]);
  const attempts = Object.keys(m.attempts || {}).filter((id) => !m.practiced[id]);
  const chips = (list, cls = "") => list.map((w) => `<span class="chip ${cls} ja">${w.ja} · ${w.en}</span>`).join("") || "—";
  $("summaryBody").innerHTML = `
    <p><b>${done.length} / ${words.length}</b> words practiced.</p>
    <div class="kv">Practiced</div><div class="sum-list">${chips(done, "ok")}</div>
    <div class="kv">Not yet</div><div class="sum-list">${chips(todo)}</div>
    ${attempts.length ? `<div class="kv">Tried but not quite</div><div class="sum-list">${attempts.map((id) => `<span class="chip ja">${jaOf(id)}</span>`).join("")}</div>` : ""}`;
  $("summary").showModal();
}

// ---------- connect ----------
async function start() {
  $("startBtn").disabled = true;
  $("transcript").innerHTML = "";
  $("debug").innerHTML = "";
  userMsgs.length = 0;
  for (const k of Object.keys(wordState)) delete wordState[k];
  const p = patienceVal();

  client = new PipecatClient({
    transport: new SmallWebRTCTransport(),
    enableMic: true,
    enableCam: false,
    callbacks: {
      onTrackStarted: (track, participant) => {
        if (participant?.local || track.kind !== "audio") return;
        const audio = $("botAudio");
        audio.srcObject = new MediaStream([track]);
        // Auto-start has no click; if the browser blocks audio, play on the first click
        audio.play().catch(() => {
          sys("Click anywhere to hear the tutor");
          document.addEventListener("click", () => audio.play(), { once: true });
        });
      },
      onServerMessage,
      onUserStartedSpeaking: () => { userInTurn = true; lastInterimChange = Date.now(); },
      onUserStoppedSpeaking: () => { userInTurn = false; },
      onUserTranscript: (d) => {
        if (!d.final) {
          if (d.text !== lastInterim) { lastInterim = d.text; lastInterimChange = Date.now(); }
          if (!interimEl) interimEl = addMsg("user interim", "You", "");
          interimEl.querySelector(".txt").textContent = d.text;
          scroll();
          return;
        }
        if (interimEl) { interimEl.remove(); interimEl = null; }
        lastInterim = "";
        lastUserEl = addMsg("user", "You", highlight(d.text));
        userMsgs.push({ el: lastUserEl, text: d.text });
      },
      onBotLlmStarted: () => { botThinking = true; botEl = null; },
      onBotLlmText: (d) => {
        if (!botEl) botEl = addMsg(`bot ${mode === "help" ? "help" : ""}`, mode === "help" ? `Tutor <span class="tag help">help</span>` : "Tutor", "");
        botEl._text = (botEl._text || "") + d.text;
        renderBot(botEl);
        scroll();
      },
      onBotLlmStopped: () => { botThinking = false; },
      onBotStartedSpeaking: () => { botSpeaking = true; },
      onBotStoppedSpeaking: () => {
        botSpeaking = false;
        const el = botEl, k = el?._k;
        if (!k) return;
        // Let the last chunk's highlight fade out before returning to plain text
        k.cur = null;
        k.said = (el._text || "").length;
        renderBot(el);
        setTimeout(() => { if (el._k === k) { el._k = null; renderBot(el); } }, 600);
      },
      onDisconnected: () => stopped(),
      onError: (e) => dbg("err", `client error: ${esc(JSON.stringify(e?.data ?? e))}`),
    },
  });

  try {
    await client.connect({
      webrtcRequestParams: {
        endpoint: "/api/offer",
        requestData: { eot_threshold: p.eot_threshold, eot_timeout_ms: p.eot_timeout_ms },
      },
    });
    $("startBtn").textContent = "Stop";
    $("startBtn").className = "danger";
    $("startBtn").disabled = false;
    $("muteBtn").disabled = false;
    setMuted(false);
    setMode("conversation");
  } catch (e) {
    dbg("err", `connect failed: ${esc(String(e))}`);
    sys("Couldn't connect. Is the server running?");
    client = null;
    $("startBtn").disabled = false;
  }
}

async function stop() {
  if (!client) return;
  client.sendClientMessage("summary", {});
  await new Promise((r) => setTimeout(r, 400));
  await client.disconnect();
}

function stopped() {
  if (!client) return;
  client = null;
  botSpeaking = botThinking = userInTurn = false;
  $("startBtn").textContent = "Start";
  $("startBtn").className = "primary";
  $("startBtn").disabled = false;
  setMuted(false);
  $("muteBtn").disabled = true;
  setMode(mode);
  sys("Session ended");
}

$("startBtn").onclick = () => (client ? stop() : start());
start();
</script>
